version: "3.9"

services:
  # ── Nginx Reverse Proxy (Exposed to Host / Tailscale) ─────────────────────
  nginx:
    image: ghcr.io/razielzaarur1/fintrack-nginx:latest
    build: ./config/nginx
    container_name: finapp-nginx
    networks:
      - fintrack-net
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - api-gateway
      - web
    volumes:
      - /opt/finapp/certs:/etc/ssl/tailscale:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 16m

  # ── Web PWA Frontend (Original) ──────────────────────────────────────────
  web:
    image: ghcr.io/razielzaarur1/fintrack-web:latest
    build: ./services/web
    container_name: finapp-web
    networks:
      - fintrack-net
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    security_opt:
      - no-new-privileges:true
    read_only: false
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  # ── Web v2 New Interface (Port 4747) ─────────────────────────────────────
  web-v2:
    image: ghcr.io/razielzaarur1/fintrack-web-v2:latest
    build: ./services/web-v2
    container_name: finapp-web-v2
    networks:
      - fintrack-net
    ports:
      - "4747:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    security_opt:
      - no-new-privileges:true
    read_only: false
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  # ── API Gateway ──────────────────────────────────────────────────────────
  api-gateway:
    image: ghcr.io/razielzaarur1/fintrack-api-gateway:latest
    build: ./services/api-gateway
    container_name: finapp-api-gateway
    networks:
      - fintrack-net
    environment:
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-fintrack-master-production-key-2026-v2-secure}
      - SCRAPER_URL=http://scraper-worker:3002
      - NOTIFIER_URL=http://notifier:3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=finance
      - DB_USER=${DB_USER:-finance_admin}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-fintrack-jwt-secret-key-production-2026}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-production}
    security_opt:
      - no-new-privileges:true
    read_only: false
    restart: unless-stopped
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 192m
        reservations:
          memory: 64m

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finapp-postgres
    networks:
      - fintrack-net
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=finance
      - POSTGRES_USER=finance_admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init:/docker-entrypoint-initdb.d:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  # ── Scraper Microservice (Port 3002) ─────────────────────────────────────
  scraper-worker:
    image: ghcr.io/razielzaarur1/fintrack-scraper-worker:latest
    build: ./services/scraper
    container_name: finapp-scraper-worker
    command: ["node", "src/server.js"]
    networks:
      - fintrack-net
    expose:
      - "3002"
    environment:
      - PORT=3002
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-fintrack-master-production-key-2026-v2-secure}
      - NOTIFIER_URL=http://notifier:3001
      - INTERNAL_API_URL=http://api-gateway:3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=finance
      - DB_USER=${DB_USER:-finance_admin}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - LOG_LEVEL=${LOG_LEVEL:-info}
    security_opt:
      - seccomp:./seccomp/chrome.json
      - no-new-privileges:true
    cap_add:
      - SYS_ADMIN
    read_only: false
    restart: unless-stopped
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  # ── Notifier (Telegram & OTP) ────────────────────────────────────────────
  notifier:
    image: ghcr.io/razielzaarur1/fintrack-notifier:latest
    build: ./services/notifier
    container_name: finapp-notifier
    networks:
      - fintrack-net
    expose:
      - "3001"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

networks:
  fintrack-net:
    driver: bridge

volumes:
  postgres-data:
