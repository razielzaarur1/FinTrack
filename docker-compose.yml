version: "3.9"

services:
  # ── Nginx Reverse Proxy (Exposed to Host / Tailscale Interface) ──
  nginx:
    build: ./config/nginx
    container_name: finapp-nginx
    networks:
      - public-net
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - api-gateway
      - web
    volumes:
      - /opt/finapp/certs:/etc/ssl/tailscale:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32m
        reservations:
          memory: 16m

  # ── Web PWA Frontend ─────────────────────────────────────────────
  web:
    build: ./services/web
    container_name: finapp-web
    networks:
      - public-net
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    security_opt:
      - no-new-privileges:true
    read_only: false
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  # ── API Gateway ─────────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    container_name: finapp-api-gateway
    networks:
      - public-net
      - internal-net
      - vault-net
    environment:
      - VAULT_ADDR=http://vault:8200
      - NOTIFIER_URL=http://notifier:3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=finance
      - DB_USER=api_user
      - DB_PASSWORD=${API_DB_PASSWORD:-}
      - DB_PASSWORD_FILE=/opt/finapp/secrets/api_db_password.txt
      - VAULT_ROLE_ID=${VAULT_API_ROLE_ID:-}
      - VAULT_ROLE_ID_FILE=/opt/finapp/secrets/vault_api_role_id.txt
      - VAULT_SECRET_ID=${VAULT_API_SECRET_ID:-}
      - VAULT_SECRET_ID_FILE=/opt/finapp/secrets/vault_api_secret_id.txt
      - JWT_SECRET=${JWT_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - finapp-secrets:/opt/finapp/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  # ── Vault ────────────────────────────────────────────────────────
  vault:
    build: ./config/vault
    container_name: finapp-vault
    networks:
      - vault-net
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault-data:/vault/data
      - vault-audit:/vault/logs
      - finapp-secrets:/opt/finapp/secrets
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  # ── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finapp-postgres
    networks:
      - internal-net
      - worker-net
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-}
      - POSTGRES_DB=finance
      - POSTGRES_USER=finance_admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - finapp-secrets:/opt/finapp/secrets
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  # ── Egress Proxy (Squid) ─────────────────────────────────────────
  egress-proxy:
    build: ./config/squid
    container_name: finapp-egress-proxy
    networks:
      worker-net:
        ipv4_address: 10.50.0.254
      egress-net:
    read_only: true
    tmpfs:
      - /run:rw,nosuid,size=32m
      - /var/run/squid:rw,nosuid,size=32m
      - /var/log/squid:rw,nosuid,size=32m
      - /var/spool/squid:rw,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 32m

  # ── Scraper Worker (Daemon) ──────────────────────────────────────
  scraper-worker:
    build: ./services/scraper
    container_name: finapp-scraper-worker
    command: ["sleep", "infinity"]
    networks:
      vault-net:
      worker-net:
        ipv4_address: 10.50.0.100
    environment:
      - VAULT_ADDR=http://vault:8200
      - NOTIFIER_URL=http://10.50.0.200:3001
      - INTERNAL_API_URL=http://api-gateway:3000
      - HTTPS_PROXY=http://10.50.0.254:3128
      - HTTP_PROXY=http://10.50.0.254:3128
      - NO_PROXY=vault,postgres,api-gateway,10.50.0.200
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=finance
      - DB_USER=scraper_user
      - DB_PASSWORD=${SCRAPER_DB_PASSWORD:-}
      - DB_PASSWORD_FILE=/opt/finapp/secrets/scraper_db_password.txt
      - VAULT_ROLE_ID=${SCRAPER_ROLE_ID:-}
      - VAULT_ROLE_ID_FILE=/opt/finapp/secrets/scraper_role_id.txt
      - VAULT_SECRET_ID=${SCRAPER_SECRET_ID:-}
      - VAULT_SECRET_ID_FILE=/opt/finapp/secrets/scraper_secret_id.txt
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - finapp-secrets:/opt/finapp/secrets:ro
    security_opt:
      - seccomp:./seccomp/chrome.json
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /home/scraper:rw,nosuid,size=64m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  # ── Notifier ─────────────────────────────────────────────────────
  notifier:
    build: ./services/notifier
    container_name: finapp-notifier
    networks:
      internal-net:
      worker-net:
        ipv4_address: 10.50.0.200
      vault-net:
    expose:
      - "3001"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_BOT_TOKEN_FILE=/opt/finapp/secrets/telegram_token.txt
      - TELEGRAM_ALLOWED_CHAT_ID_FILE=/opt/finapp/secrets/telegram_chat_id.txt
      - VAULT_UNSEAL_KEY1_FILE=/opt/finapp/secrets/vault_unseal_key1.txt
      - VAULT_UNSEAL_KEY_1=${VAULT_UNSEAL_KEY1:-}
      - VAULT_ADDR=http://vault:8200
      - HTTPS_PROXY=http://10.50.0.254:3128
      - NO_PROXY=vault,postgres,api-gateway,10.50.0.100
    volumes:
      - finapp-secrets:/opt/finapp/secrets:ro
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  # ── Docker Socket Proxy ──────────────────────────────────────────
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: finapp-socket-proxy
    networks:
      - scheduler-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32m
        reservations:
          memory: 16m

  # ── Scheduler (Ofelia) ───────────────────────────────────────────
  scheduler:
    build: ./config/scheduler
    container_name: finapp-scheduler
    networks:
      - scheduler-net
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32m
        reservations:
          memory: 16m

networks:
  public-net:
  internal-net:
  vault-net:
    internal: true
  scheduler-net:
  egress-net:
  worker-net:
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.50.0.0/16

volumes:
  vault-data:
  vault-audit:
  postgres-data:
  finapp-secrets:
