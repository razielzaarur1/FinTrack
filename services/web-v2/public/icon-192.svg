<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Shield Body -->
  <g transform="translate(32, 28)">
    <!-- Outer Shield with Glow -->
    <path d="M64 4 C96 4 120 18 120 48 C120 90 64 124 64 124 C64 124 8 90 8 48 C8 18 32 4 64 4 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Inner Shield Surface -->
    <path d="M64 14 C90 14 110 26 110 50 C110 84 64 112 64 112 C64 112 18 84 18 50 C18 26 38 14 64 14 Z" 
          fill="rgba(59, 130, 246, 0.12)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="2"/>

    <!-- Financial Growth Chart Bars -->
    <rect x="36" y="68" width="10" height="24" rx="4" fill="#3b82f6"/>
    <rect x="52" y="52" width="10" height="40" rx="4" fill="#06b6d4"/>
    <rect x="68" y="42" width="10" height="50" rx="4" fill="#10b981"/>
    <rect x="84" y="30" width="10" height="62" rx="4" fill="#60a5fa"/>

    <!-- Upward Trend Line -->
    <path d="M32 74 L54 54 L72 44 L92 28" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="92" cy="28" r="5" fill="#ffffff"/>
  </g>
</svg>
