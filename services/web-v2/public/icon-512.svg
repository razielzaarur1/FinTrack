<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#131d3b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="shieldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Shield Body -->
  <g transform="translate(86, 76)">
    <!-- Outer Shield with Glow -->
    <path d="M170 12 C255 12 320 50 320 130 C320 240 170 330 170 330 C170 330 20 240 20 130 C20 50 85 12 170 12 Z" 
          fill="none" stroke="url(#shieldGrad512)" stroke-width="14" stroke-linejoin="round" filter="url(#glow512)"/>

    <!-- Inner Shield Surface -->
    <path d="M170 36 C240 36 295 68 295 135 C295 225 170 300 170 300 C170 300 45 225 45 135 C45 68 100 36 170 36 Z" 
          fill="rgba(59, 130, 246, 0.1)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="4"/>

    <!-- Financial Growth Chart Bars -->
    <rect x="95" y="180" width="26" height="65" rx="10" fill="#3b82f6"/>
    <rect x="138" y="140" width="26" height="105" rx="10" fill="#06b6d4"/>
    <rect x="180" y="110" width="26" height="135" rx="10" fill="#10b981"/>
    <rect x="222" y="80" width="26" height="165" rx="10" fill="#60a5fa"/>

    <!-- Upward Trend Line & Nodes -->
    <path d="M85 195 L145 145 L190 120 L245 75" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="245" cy="75" r="14" fill="#ffffff" filter="url(#glow512)"/>
    <circle cx="245" cy="75" r="8" fill="#06b6d4"/>
  </g>
</svg>
