[job-exec "morning-scrape"]
schedule = 0 0 8 * * *
container = finapp-scraper-worker
command = /app/scripts/run-scrape-all.sh
no-overlap = true

[job-exec "afternoon-scrape"]
schedule = 0 0 14 * * *
container = finapp-scraper-worker
command = /app/scripts/run-scrape-all.sh
no-overlap = true

[job-exec "evening-scrape"]
schedule = 0 0 20 * * *
container = finapp-scraper-worker
command = /app/scripts/run-scrape-all.sh
no-overlap = true
