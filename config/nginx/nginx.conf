worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # WebSocket connection upgrade mapping for Next.js
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Port 80: HTTP redirect to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Port 443: HTTPS Server
    server {
        listen 443 ssl;
        server_name _;

        # SSL Configuration
        ssl_certificate /etc/ssl/tailscale/server.crt;
        ssl_certificate_key /etc/ssl/tailscale/server.key;
        ssl_protocols TLSv1.3;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;

        # Proxy header defaults
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth endpoints rate limiting
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api-gateway:3000;
        }

        # General API endpoints rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api-gateway:3000;
        }

        # Health check endpoint
        location /health {
            default_type text/plain;
            return 200 "OK\n";
        }

        # Web frontend (Next.js v2 PWA) & WebSocket support
        location / {
            proxy_pass http://web-v2:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
