worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # WebSocket connection upgrade mapping for Next.js
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Port 80: HTTP redirect to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Port 443: Primary HTTPS Server (Full FinTrack Interface for Tailscale VPN)
    server {
        listen 443 ssl;
        server_name _;

        # SSL Configuration
        ssl_certificate /etc/ssl/tailscale/server.crt;
        ssl_certificate_key /etc/ssl/tailscale/server.key;
        ssl_protocols TLSv1.3;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;

        # Proxy header defaults
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth endpoints rate limiting
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api-gateway:3000;
        }

        # General API endpoints rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api-gateway:3000;
        }

        # Health check endpoint
        location /health {
            default_type text/plain;
            return 200 "OK\n";
        }

        # Telegram Mini App path on main port (allow Telegram iframe embedding)
        location /tma/ {
            proxy_pass http://web-v2:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org telegram:;" always;
        }

        # Web frontend (Next.js v2 PWA) & WebSocket support
        location / {
            add_header X-Frame-Options "DENY" always;
            proxy_pass http://web-v2:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Port 4748: Dedicated Isolated Telegram Mini App Interface (for Tailscale Funnel / Tunnel)
    # Strictly exposes ONLY the /tma/* viewer/editor and blocks all other routes with HTTP 403 Forbidden.
    server {
        listen 4748;
        server_name _;

        # Security Headers for TMA
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org telegram:;" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. ALLOWED: TMA Scoped API Endpoints
        location /api/v2/transactions/tma/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api-gateway:3000;
        }

        # 2. ALLOWED: Next.js Static Chunks and CSS required by TMA
        location /_next/ {
            proxy_pass http://web-v2:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_bypass 1;
        }

        # 3. ALLOWED: Next.js TMA Page routes
        location /tma/ {
            proxy_pass http://web-v2:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # 4. ALLOWED: Static assets (PWA icons/manifest)
        location ~* ^/(manifest\.json|icon-.*\.svg|favicon\.ico)$ {
            proxy_pass http://web-v2:3000;
        }

        # 5. Health check
        location = /health {
            default_type text/plain;
            return 200 "OK\n";
        }

        # 6. STRICT BLOCK: EVERYTHING ELSE RETURNS 404 NOT FOUND
        # Mimics a completely non-existent route with Chrome error page style
        location / {
            default_type text/html;
            return 404 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 Not Found</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:0;padding:60px 24px;background:#fff;color:#202124}@media(prefers-color-scheme:dark){body{background:#202124;color:#e8eaed}}h1{font-size:24px;font-weight:500;margin:0 0 16px 0}p{font-size:14px;color:#5f6368;line-height:22px;margin:0 0 16px 0}@media(prefers-color-scheme:dark){p{color:#9aa0a6}}ul{font-size:14px;color:#5f6368;line-height:24px;margin:0 0 28px 0;padding-inline-start:20px}@media(prefers-color-scheme:dark){ul{color:#9aa0a6}}button{background:#1a73e8;color:#fff;border:none;border-radius:4px;padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer}button:hover{background:#1765cc}.err{font-size:11px;color:#70757a;margin-top:40px;font-weight:500}@media(prefers-color-scheme:dark){.err{color:#9aa0a6}}</style></head><body><div style="max-width:600px;margin:0 auto;"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" style="margin-bottom:24px"><path d="M12 6C10.3431 6 9 7.34315 9 9V39C9 40.6569 10.3431 42 12 42H36C37.6569 42 39 40.6569 39 39V16L29 6H12Z" fill="#dadce0"/><path d="M28 6V17H39L28 6Z" fill="#bdc1c6"/><circle cx="19" cy="25" r="2.5" fill="#5f6368"/><circle cx="29" cy="25" r="2.5" fill="#5f6368"/><path d="M28 33C27 31.5 25 31.5 24 31.5C23 31.5 21 31.5 20 33" stroke="#5f6368" stroke-width="2" stroke-linecap="round"/></svg><h1>This site can’t be reached</h1><p>The webpage might be temporarily down or it may have moved permanently to a new web address.</p><ul><li>Check the connection</li><li>Check the proxy and the firewall</li></ul><button onclick="location.reload()">Reload</button><div class="err">HTTP ERROR 404</div></div></body></html>';
        }
    }
}
