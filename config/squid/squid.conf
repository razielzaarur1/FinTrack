# Squid proxy configuration for financial scrapers egress control

http_port 3128
pid_filename /var/run/squid/squid.pid
pinger_enable off

# Access Control Lists (ACL)
acl SSL_port port 443
acl CONNECT method CONNECT

# Allowed destination domains (Israeli financial institutions and Telegram API)
acl allowed_sites dstdomain .bankhapoalim.co.il
acl allowed_sites dstdomain .leumi.co.il
acl allowed_sites dstdomain .discountbank.co.il
acl allowed_sites dstdomain .mizrahi-tefahot.co.il
acl allowed_sites dstdomain .fibi.co.il
acl allowed_sites dstdomain .bank-yahav.co.il
acl allowed_sites dstdomain .onezero.co.il
acl allowed_sites dstdomain .mercantile.co.il
acl allowed_sites dstdomain .bankmassad.co.il
acl allowed_sites dstdomain .isracard.co.il
acl allowed_sites dstdomain .max.co.il
acl allowed_sites dstdomain .cal-online.co.il
acl allowed_sites dstdomain .icc.co.il
acl allowed_sites dstdomain api.telegram.org

# HTTP Access Rules
http_access allow CONNECT allowed_sites SSL_port
http_access deny all

# Disable Caching
cache deny all
cache_mem 16 MB
maximum_object_size 0 KB

# Logging
access_log stdio:/var/log/squid/access.log combined
strip_query_terms off
